[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bas_engine"]
package-dir = {bas_engine = "."}

[project]
name = "opentakeoff-bas-math"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "mypy>=1.11", "pandas>=2.2", "pandas-stubs>=2.2"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["bas_engine/(tests|build)/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
