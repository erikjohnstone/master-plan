# Mandatory architecture challenger. Same dataset, splits, calibration, and
# gates as the DINOv2 contenders -- the production decision comes from
# held-out evidence, not architecture preference (SYMBOL-METRIC-MODEL-PRODUCTION-PLAN.md).
model:
  backbone: convnext_tiny
  projection_dim: 256
  input_size: 280
  dropout: 0.0
loss:
  name: proxy_anchor
sampler:
  p_identities: 16
  k_samples: 4
optim:
  name: adamw
  phase1:
    head_lr: 1.0e-4
    backbone_lr: 0.0
    epochs: 8
    warmup_steps: 200
  phase2:
    head_lr: 1.0e-4
    backbone_lr: 1.0e-5
    unfreeze_last_n_blocks: 4  # last 4 convnext stages/blocks per the shared recipe
    epochs: 12
    warmup_steps: 200
  schedule: warmup_cosine
  weight_decay: 0.05
precision: bf16
seeds: [17, 42, 1337]
early_stopping:
  metric: dev_recall_at_5
  patience_evals: 5
  mode: max
